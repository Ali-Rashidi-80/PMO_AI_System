events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  server {
    listen 8080;
    server_name localhost;

    location / {
      proxy_pass http://pmo-ui:3000/;
      proxy_set_header Host $host;
    }

    location /static/ {
      proxy_pass http://pmo-ui:3000/static/;
    }

    location /api/ {
      proxy_pass http://lmstudio-gateway:8081/api/;
      proxy_read_timeout 900s;
      proxy_connect_timeout 30s;
      proxy_send_timeout 900s;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
    }

    location /v1/ {
      proxy_pass http://lmstudio-gateway:8081/v1/;
      proxy_read_timeout 900s;
    }

    location /webhook/ {
      proxy_pass http://pmo-n8n:5678/webhook/;
      proxy_read_timeout 900s;
    }

    location /health {
      proxy_pass http://lmstudio-gateway:8081/health;
    }
  }
}
