name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows & config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation deps
        run: pip install pyyaml

      - name: Secret scan (tracked files)
        shell: pwsh
        run: ./scripts/scan_secrets.ps1

      - name: Validate n8n workflow exports
        run: python scripts/validate_workflow.py Workflows

      - name: Verify models.yaml parses
        run: python -c "import yaml; yaml.safe_load(open('config/models.yaml'))"

  test:
    name: Unit & integration (no live LM)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/lmstudio-gateway/requirements.txt
          pip install -r services/lmstudio-gateway/requirements-test.txt
          pip install pyyaml

      - name: Generate test fixtures
        run: python scripts/generate_fixtures.py

      - name: Run pytest (exclude live)
        run: python -m pytest tests/unit tests/integration -m "not live" -q --tb=short

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway & UI images
        run: docker compose build lmstudio-gateway pmo-ui

      - name: Verify compose config
        run: docker compose config --quiet
