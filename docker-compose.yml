version: "3.8"

networks:
  pmo_ai_net:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:

services:
  nginx:
    image: mirror2.chabokan.net/nginx:latest
    container_name: pmo_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pmo-ui:
        condition: service_started
      lmstudio-gateway:
        condition: service_healthy
      pmo-n8n:
        condition: service_started
    networks:
      - pmo_ai_net
    restart: always

  pmo-ui:
    build: ./services/pmo-ui
    container_name: pmo_ui
    expose:
      - "3000"
    networks:
      - pmo_ai_net
    restart: always

  lmstudio-gateway:
    build: ./services/lmstudio-gateway
    container_name: pmo_lmstudio_gateway
    expose:
      - "8081"
    environment:
      LMSTUDIO_UPSTREAM: ${LMSTUDIO_UPSTREAM:-http://host.docker.internal:1234}
      N8N_INTERNAL_URL: http://pmo-n8n:5678
      QDRANT_URL: http://pmo-qdrant:6333
      GATEWAY_PORT: "8081"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-pmo-secret-2026}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-gemma-4-e4b-it-ud}
      EMBED_MODEL_ID: ${EMBED_MODEL_ID:-nomic-embed-text-v2}
      LLM_TIMEOUT_SECONDS: "900"
      MAX_CONCURRENT: "2"
      PMO_DOCS_PATH: /data/pmo_docs
      PROMPTS_PATH: /config/prompts
      QDRANT_COLLECTION: pmo_knowledge_base
      PMO_MAX_UPLOAD_MB: ${PMO_MAX_UPLOAD_MB:-30}
      PMO_MAX_FILES_PER_UPLOAD: ${PMO_MAX_FILES_PER_UPLOAD:-10}
      PMO_UPLOAD_AUTO_INGEST: ${PMO_UPLOAD_AUTO_INGEST:-true}
      PMO_RAG_RESET: ${PMO_RAG_RESET:-false}
      PMO_RAG_MIN_SCORE: ${PMO_RAG_MIN_SCORE:-0.35}
      PMO_CHUNK_SIZE: ${PMO_CHUNK_SIZE:-1000}
      PMO_CHUNK_OVERLAP: ${PMO_CHUNK_OVERLAP:-200}
      PMO_STRICT_CLEAN: ${PMO_STRICT_CLEAN:-false}
      PMO_EMBED_BATCH_SIZE: ${PMO_EMBED_BATCH_SIZE:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./pmo_docs:/data/pmo_docs:rw
      - ./config/prompts:/config/prompts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pmo_ai_net
    restart: always

  pmo-n8n:
    image: mirror2.chabokan.net/n8nio/n8n:latest
    container_name: pmo_n8n
    ports:
      - "127.0.0.1:5678:5678"
    command: ["start"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:8080/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tehran}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-pmo-dev-encryption-key-32chars!!}
      N8N_HTTP_REQUEST_TIMEOUT: "900000"
      N8N_PUSH_BACKEND: websocket
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USAGE_DATA_COLLECTION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_PRAGMAS: "journal_mode=WAL"
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-pmo-secret-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./pmo_docs:/data/pmo_docs
      - ./pmo_docs/weekly_reports:/data/weekly_reports
      - ./services/n8n/bootstrap:/bootstrap:ro
      - ./Workflows:/bootstrap/workflows:ro
    networks:
      - pmo_ai_net
    depends_on:
      pmo-qdrant:
        condition: service_started
      lmstudio-gateway:
        condition: service_healthy
    restart: always

  pmo-qdrant:
    image: mirror2.chabokan.net/qdrant/qdrant:latest
    container_name: pmo_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pmo_ai_net
    restart: always
