version: "3.8"

networks:
  pmo_ai_net:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:

services:
  nginx:
    image: pmo-nginx:prod
    container_name: pmo_nginx
    ports:
      - "8080:8080"
    depends_on:
      - pmo-ui
      - lmstudio-gateway
      - pmo-n8n
    networks:
      - pmo_ai_net
    restart: always

  pmo-ui:
    image: pmo-ui:prod
    container_name: pmo_ui
    expose:
      - "3000"
    networks:
      - pmo_ai_net
    restart: always

  lmstudio-gateway:
    image: pmo-gateway:prod
    container_name: pmo_lmstudio_gateway
    expose:
      - "8081"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pmo_ai_net
    restart: always

  pmo-n8n:
    image: pmo-n8n:prod
    container_name: pmo_n8n
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./pmo_docs:/data/pmo_docs
      - ./pmo_docs/weekly_reports:/data/weekly_reports
    networks:
      - pmo_ai_net
    restart: always

  pmo-qdrant:
    image: mirror2.chabokan.net/qdrant/qdrant:latest
    container_name: pmo_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pmo_ai_net
    restart: always
